<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Ticket Design with HTML &amp; CSS 🎟️ | Modern Ticket UI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="event-ticket">
  <div class="ticket-main">
    <div class="event-brand">
      <span class="brand-icon">✦</span>
      <span>EVENTORA</span>
    </div>

    <p class="event-label">LIVE EXPERIENCE</p>

    <h1>Future<br>Creators</h1>

    <p class="event-description">
      An inspiring evening of ideas, music, creativity, and innovation.
    </p>

    <div class="event-details">
      <div>
        <small>DATE</small>
        <strong>28 SEP 2026</strong>
      </div>

      <div>
        <small>TIME</small>
        <strong>06:30 PM</strong>
      </div>

      <div>
        <small>VENUE</small>
        <strong>Dhaka Arena</strong>
      </div>
    </div>

    <div class="event-footer">
      <div>
        <small>ATTENDEE</small>
        <strong>SAIFUL KHAN</strong>
      </div>

      <div>
        <small>TYPE</small>
        <strong>VIP PASS</strong>
      </div>
    </div>
  </div>

  <div class="ticket-divider">
    <span></span>
  </div>

  <div class="ticket-stub">
    <div class="qr-code">
      <i></i>
      <i></i>
      <i></i>
      <i></i>
      <i></i>
      <i></i>
      <i></i>
      <i></i>
      <i></i>
    </div>

    <strong>VIP ACCESS</strong>
    <span>#EV-28491</span>

    <button type="button">Download</button>
  </div>
</div>
</body>
</html>
